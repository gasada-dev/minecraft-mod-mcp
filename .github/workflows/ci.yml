name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - run: ./gradlew :packages:common:clean :packages:common:publish --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: maven-local
          path: .maven-local/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-mods:
    needs: build-common
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        loader: [forge, fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: actions/download-artifact@v4
        with:
          name: maven-local
          path: .maven-local/
      - run: ./gradlew clean build -x test --no-daemon --console=plain
        working-directory: packages/mods/26.2/${{ matrix.loader }}
      - run: |
          mkdir release-jars
          jar=$(find packages/mods/26.2/${{ matrix.loader }}/build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n1)
          test -n "$jar"
          cp "$jar" release-jars/minecraft-mcp-26.2-${{ matrix.loader }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mod-26.2-${{ matrix.loader }}
          path: release-jars/
          if-no-files-found: error
          retention-days: 1

  headless-smoke:
    needs: build-mods
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        loader: [forge, fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with:
          name: mod-26.2-${{ matrix.loader }}
          path: dist/
      - run: npm ci
        working-directory: packages/minecraft-mod-mcp
      - run: npm run build
        working-directory: packages/minecraft-mod-mcp
      - run: python scripts/ci_helper.py smoke --mc-ver 26.2 --loader ${{ matrix.loader }} --jdk-ver 25 --mod-jar dist/minecraft-mcp-26.2-${{ matrix.loader }}.jar --world CI_TestWorld
