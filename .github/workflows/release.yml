name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/check_versions.py ${{ github.ref_name }}

  build:
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        loader: [forge, fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - run: ./gradlew :packages:common:clean :packages:common:publish --no-daemon --console=plain
      - run: ./gradlew clean build -x test --no-daemon --console=plain
        working-directory: packages/mods/26.2/${{ matrix.loader }}
      - run: |
          mkdir release-jars
          jar=$(find packages/mods/26.2/${{ matrix.loader }}/build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n1)
          test -n "$jar"
          cp "$jar" release-jars/minecraft-mcp-26.2-${{ matrix.loader }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mod-26.2-${{ matrix.loader }}
          path: release-jars/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-26.2-*
          path: dist/
          merge-multiple: true
      - run: |
          test "$(find dist -maxdepth 1 -name '*.jar' | wc -l)" -eq 3
          for loader in forge fabric neoforge; do test -f "dist/minecraft-mcp-26.2-$loader.jar"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          fail_on_unmatched_files: true
